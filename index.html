g'],['📦','Chi phí theo sản phẩm','Đánh giá ngân sách hỗ trợ theo nhóm sản phẩm'],['📍','Chi phí theo khu vực','So sánh mức chi phí giữa các khu vực kinh doanh'],['↗','Hiệu quả chương trình','Đo lường doanh số, chi phí và tỷ lệ hoàn thành']].map(x=>`<div class="panel report"><div class="ric">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button onclick="showToast('Đã mở báo cáo mẫu')">Xem báo cáo →</button></div>`).join('')}</div>`,settings:`<div class="grid"><div class="panel"><h3>Quy trình phê duyệt</h3><p class="report-grid-note">Thiết lập cấp duyệt theo giá trị đề nghị.</p>${[['Dưới 10 triệu','Trưởng bộ phận'],['10 – 50 triệu','Giám đốc bán hàng'],['Trên 50 triệu','Ban giám đốc']].map(x=>`<div class="activity"><b style="flex:1">${x[0]}</b><span>${x[1]}</span></div>`).join('')}<button class="btn primary" style="margin-top:15px" onclick="showToast('Đã lưu cấu hình')">Lưu thay đổi</button></div><div class="panel"><h3>Danh mục hệ thống</h3><p class="report-grid-note">Quản lý dữ liệu dùng chung.</p>${['Loại chi phí','Nguồn ngân sách','Khu vực kinh doanh','Nhóm khách hàng','Loại hồ sơ'].map(x=>`<div class="activity"><b style="flex:1">${x}</b><span>→</span></div>`).join('')}</div></div>`};
let current='dashboard';const nav=document.getElementById('nav'),pageRoot=document.getElementById('pages'),title=document.getElementById('title');nav.innerHTML=navs.map(x=>`<button data-id="${x[0]}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');function go(id){current=id;pageRoot.innerHTML=`<div class="page active">${pages[id]}</div>`;title.textContent=navs.find(x=>x[0]===id)[2];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));side.classList.remove('open')}function openModal(){modal.style.display='grid'}function closeModal(){modal.style.display='none'}function showToast(t){toast.textContent='✓ '+t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)}function saveModal(){closeModal();showToast('Đã lưu bản ghi mới thành công')}search.oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')};go('dashboard');
